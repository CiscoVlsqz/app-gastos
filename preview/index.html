<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <style>
  :root {
    --bg: #efefef;
    --page-bg: var(--bg);
    --card: #ffffff;
    --accent: #141414;
    --accent-contrast: #ffffff;
    --accent-soft: #f1f1f1;
    --text: #141414;
    --muted: #6b6b70;
    --border: #e4e4e6;
    --danger: #d9483f;
    --nav-bg: rgba(255, 255, 255, 0.9);
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 16px 32px rgba(20, 20, 20, 0.07);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --app-max-width: 480px;

    /* Paleta categórica (validada — ver skill de data-viz) para el anillo de Resumen */
    --series-1: #2a78d6;
    --series-2: #1baf7a;
    --series-3: #eda100;
    --series-4: #8d6a2f;
    --series-5: #4a3aa7;
    --series-6: #e34948;
    --series-7: #e87ba4;
  }

  html.dark {
    --bg: #19191b;
    --card: #242426;
    --accent: #f5f5f5;
    --accent-contrast: #141414;
    --accent-soft: rgba(255, 255, 255, 0.06);
    --text: #f5f5f5;
    --muted: #98989c;
    --border: #333336;
    --danger: #ff6b60;
    --nav-bg: rgba(36, 36, 38, 0.9);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 32px rgba(0, 0, 0, 0.5);

    --series-1: #3987e5;
    --series-2: #199e70;
    --series-3: #c98500;
    --series-4: #b08838;
    --series-5: #9085e9;
    --series-6: #e66767;
    --series-7: #df7ab0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }

  #app {
    max-width: var(--app-max-width);
    width: 100%;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .view-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .view-scroll.scroll-locked { overflow: hidden; }

  .view-scroll::-webkit-scrollbar {
    width: 4px;
  }

  .view-scroll::-webkit-scrollbar-track {
    background: transparent;
  }

  .view-scroll::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }

  .view-scroll::-webkit-scrollbar-thumb:hover {
    background: var(--muted);
  }

  header.top {
    flex-shrink: 0;
    padding: calc(20px + env(safe-area-inset-top, 0px))
             max(20px, env(safe-area-inset-right, 0px))
             8px
             max(20px, env(safe-area-inset-left, 0px));
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .top-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  header.top h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  header.top p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .view {
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  }
  .view[hidden] { display: none; }

  /* Aire extra al fondo para que el FAB "+" no tape el último movimiento */
  #view-historial { padding-bottom: 96px; }

  .card {
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 14px;
  }

  .amount-label {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .amount-input {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    padding: 10px 0 8px;
  }

  .amount-input span {
    font-size: 24px;
    font-weight: 500;
    color: var(--muted);
  }

  .amount-input input {
    border: none;
    background: transparent;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    width: 220px;
    text-align: center;
    color: var(--text);
    outline: none;
  }

  input::placeholder { color: var(--muted); opacity: 1; }
  input:focus::placeholder { color: transparent; }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 4px 4px 10px;
  }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 1px 2px rgba(20, 20, 20, 0.04);
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
  }

  .segmented {
    display: flex;
    gap: 8px;
  }

  .segmented button {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
  }

  .segmented button.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .field input[type="date"],
  .field input[type="text"] {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--text);
    background: var(--card);
    outline: none;
    font-family: inherit;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  select {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 40px 12px 14px;
    font-size: 16px;
    color: var(--text);
    background-color: var(--card);
    outline: none;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 22px) center, calc(100% - 17px) center;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }

  select:focus { border-color: var(--accent); }

  .amount-input input:focus-visible,
  .field input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-primary:disabled {
    background: #d9d9dd;
    color: #55555a;
    cursor: not-allowed;
  }

  .btn-small {
    width: auto;
    padding: 10px 16px;
    font-size: 14px;
  }

  .btn-danger {
    flex: 1;
    padding: 14px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-danger-solid {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 999px;
    background: var(--danger);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-secondary {
    flex: 1;
    padding: 14px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(96px + var(--safe-bottom));
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 20;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; }

  .toast.toast-error {
    background: var(--danger);
    color: #fff;
    white-space: normal;
    max-width: min(340px, calc(100vw - 32px));
    text-align: center;
  }

  .day-group { margin-bottom: 18px; }

  .day-group .day-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 4px 8px;
  }

  .mov-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 20px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    margin-bottom: 8px;
    cursor: pointer;
  }

  .mov-item .icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .mov-item .info {
    flex: 1;
    min-width: 0;
  }

  .mov-item .info .cat {
    font-size: 14px;
    font-weight: 600;
  }

  .mov-item .info .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mov-item .amount {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }

  @keyframes flash {
    0% { background: var(--accent-soft); }
    100% { background: var(--card); }
  }

  .mov-item.just-added { animation: flash 1s ease-out; }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 20px;
  }

  /* ---------- Skeletons de carga ---------- */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .skeleton-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 20px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    margin-bottom: 8px;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .skeleton-item .sk-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }

  .skeleton-item .sk-lines { flex: 1; }

  .skeleton-item .sk-line {
    height: 10px;
    border-radius: 6px;
    background: var(--border);
    width: 70%;
  }

  .skeleton-item .sk-line.short {
    width: 42%;
    margin-top: 8px;
  }

  .skeleton-item .sk-amt {
    width: 54px;
    height: 12px;
    border-radius: 6px;
    background: var(--border);
    flex-shrink: 0;
  }

  .init-error {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--danger);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  .init-error[hidden] { display: none; }

  .init-error-msg {
    font-size: 13px;
    color: var(--text);
    min-width: 0;
  }

  .init-error .btn-small { flex-shrink: 0; }

  .resumen-total .value.resumen-loading {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .resumen-total {
    text-align: center;
    padding: 8px 0 4px;
  }

  .trend-caption {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .trend-wrap {
    position: relative;
    width: 100%;
    height: 100px;
    margin-bottom: 12px;
    touch-action: none;
    cursor: pointer;
  }

  .trend-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .trend-tooltip {
    position: absolute;
    top: 0;
    left: 0;
    transform: translate(-50%, -100%) translateY(-8px);
    background: var(--text);
    color: var(--bg);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 8px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
  }

  .trend-tooltip[hidden] { display: none; }

  .resumen-total .value {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .resumen-total .label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .insight {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }

  .split-bar {
    display: flex;
    gap: 3px;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--border);
    margin-bottom: 14px;
  }

  .split-bar > div { min-width: 4px; }

  .legend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .legend-row:last-child { border-bottom: none; }

  .legend-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-amt {
    color: var(--muted);
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .persona-split {
    display: flex;
    gap: 10px;
  }

  .persona-split .card {
    flex: 1;
    text-align: center;
    margin-bottom: 0;
  }

  .persona-split .card .p-name {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  .persona-split .card .p-amt {
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
  }

  nav.bottom-nav {
    flex-shrink: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 8px calc(8px + var(--safe-bottom));
    z-index: 10;
  }

  nav.bottom-nav button {
    flex: 1;
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  nav.bottom-nav button .nav-icon {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  nav.bottom-nav button .nav-icon svg {
    width: 21px;
    height: 21px;
  }

  nav.bottom-nav button.active { color: var(--accent); }

  .fab {
    position: absolute;
    right: 16px;
    bottom: calc(76px + var(--safe-bottom));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(20, 20, 20, 0.22), 0 2px 4px rgba(20, 20, 20, 0.12);
    z-index: 15;
  }

  .fab[hidden] { display: none; }

  .fab svg { width: 24px; height: 24px; }

  /* ---------- Modales ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }

  .modal-overlay[hidden] { display: none; }

  .modal-sheet {
    background: var(--bg);
    width: 100%;
    max-width: var(--app-max-width);
    max-height: 88vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    border-radius: 28px 28px 0 0;
    padding: 20px
             max(20px, env(safe-area-inset-right, 0px))
             calc(20px + var(--safe-bottom))
             max(20px, env(safe-area-inset-left, 0px));
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
    padding-block: 8px;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 18px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .modal-actions .btn-primary { flex: 2; }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 16px;
    font-size: 15px;
    font-weight: 600;
  }

  .settings-row-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-state {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .cat-manage-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }

  .cat-manage-row input {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 16px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
  }

  .cat-manage-row .cat-icono-input {
    width: 40px;
    flex-shrink: 0;
    text-align: center;
    padding: 8px 4px;
  }

  .cat-manage-row .cat-nombre-input { flex: 1; min-width: 0; }

  .new-cat-row {
    display: flex;
    gap: 8px;
  }

  .new-cat-row input {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 16px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
  }

  .new-cat-row #new-cat-icono { width: 52px; flex-shrink: 0; text-align: center; }
  .new-cat-row #new-cat-nombre { flex: 1; min-width: 0; }

  .cat-manage-row .cat-save {
    background: var(--accent);
    color: var(--accent-contrast);
    border-color: var(--accent);
  }

  .cat-manage-row .cat-del {
    color: var(--danger);
    border-color: var(--danger);
    margin-left: 4px;
  }

  .confirm-text {
    margin: 0 0 16px;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
  }

  /* ---------- Hover solo con puntero fino (desktop) ---------- */
  @media (hover: hover) {
    .btn-primary:not(:disabled):hover { opacity: 0.92; }
    .icon-btn:hover { border-color: var(--muted); }
    .mov-item:hover {
      box-shadow: 0 1px 2px rgba(20, 20, 20, 0.06), 0 20px 40px rgba(20, 20, 20, 0.12);
    }
    nav.bottom-nav button:not(.active):hover { color: var(--text); }
  }

  /* ---------- Responsive: tablet / desktop ---------- */
  @media (min-width: 700px) {
    :root { --app-max-width: 560px; --page-bg: #dcdcde; }
    html.dark { --page-bg: #0d0d0e; }

    body {
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    #app {
      height: calc(100vh - 64px);
      height: calc(100dvh - 64px);
      max-height: 800px;
      border-radius: 32px;
      box-shadow: var(--shadow);
    }

    .modal-overlay { align-items: center; }
    .modal-sheet { border-radius: 28px; max-height: 80vh; }
  }

  @media (min-width: 1024px) {
    :root { --app-max-width: 640px; }
  }
</style>

</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row">
        <div>
          <h1>Gastos Fran &amp; Marti</h1>
          <p id="subtitle">Cargando…</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-settings" type="button" title="Ajustes" aria-label="Ajustes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <script src="mock-api.js"></script>
<script>
(function () {
  'use strict';

  // ---- Api ----
  // - Preview local en el navegador: usa window.MockApi (mock-api.js).
  // - App publicada: JSONP contra la web app de Apps Script. No se puede usar
  //   fetch() porque Apps Script no manda headers de CORS; un <script src> los
  //   esquiva. Por eso todo va por GET con ?fn=&args=&callback=.
  // El build web reemplaza '__API_URL__' por la URL /exec real.
  var API_URL = '__API_URL__';
  var jsonpSeq = 0;

  var Api = {
    call: function (fn) {
      var args = Array.prototype.slice.call(arguments, 1);

      if (window.MockApi && typeof window.MockApi[fn] === 'function') {
        return Promise.resolve().then(function () {
          return window.MockApi[fn].apply(null, args);
        });
      }

      return new Promise(function (resolve, reject) {
        var cb = '__jsonp' + Date.now() + '_' + (++jsonpSeq);
        var script = document.createElement('script');
        var timer = setTimeout(function () {
          finish();
          reject(new Error('No se pudo conectar con el servidor'));
        }, 20000);

        function finish() {
          clearTimeout(timer);
          try { delete window[cb]; } catch (e) { window[cb] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cb] = function (res) {
          finish();
          if (!res || res.ok !== true) {
            reject(new Error(res && res.error ? res.error : 'Error del servidor'));
          } else {
            resolve(res.data);
          }
        };

        script.onerror = function () {
          finish();
          reject(new Error('No se pudo conectar con el servidor'));
        };

        script.src = API_URL +
          '?fn=' + encodeURIComponent(fn) +
          '&args=' + encodeURIComponent(JSON.stringify(args)) +
          '&callback=' + cb +
          '&_=' + Date.now();
        document.head.appendChild(script);
      });
    }
  };

  var state = {
    categorias: [],
    personas: [],
    categoriaSel: null,
    personaSel: null,
    editId: null,
    editPersonaSel: null,
    addPersonaSel: null,
    flashNewest: false,
    flashId: null
  };

  var els = {
    subtitle: document.getElementById('subtitle'),
    catSelect: document.getElementById('cat-select'),
    personaToggle: document.getElementById('persona-toggle'),
    monto: document.getElementById('input-monto'),
    fecha: document.getElementById('input-fecha'),
    nota: document.getElementById('input-nota'),
    btnGuardar: document.getElementById('btn-guardar'),
    toast: document.getElementById('toast'),
    historialList: document.getElementById('historial-list'),
    resumenTotalVal: document.getElementById('resumen-total-val'),
    resumenMesLabel: document.getElementById('resumen-mes-label'),
    resumenInsight: document.getElementById('resumen-insight'),
    trendWrap: document.getElementById('trend-wrap'),
    trendSvg: document.getElementById('trend-svg'),
    trendTooltip: document.getElementById('trend-tooltip'),
    trendCaption: document.getElementById('trend-caption'),
    resumenCategorias: document.getElementById('resumen-categorias'),
    resumenPersonas: document.getElementById('resumen-personas'),
    btnTheme: document.getElementById('btn-theme'),
    themeState: document.getElementById('theme-state'),
    btnSettings: document.getElementById('btn-settings'),
    editOverlay: document.getElementById('edit-overlay'),
    editClose: document.getElementById('edit-close'),
    editMonto: document.getElementById('edit-monto'),
    editCatSelect: document.getElementById('edit-cat-select'),
    editPersonaToggle: document.getElementById('edit-persona-toggle'),
    editFecha: document.getElementById('edit-fecha'),
    editNota: document.getElementById('edit-nota'),
    editSave: document.getElementById('edit-save'),
    editDelete: document.getElementById('edit-delete'),
    fabAdd: document.getElementById('fab-add'),
    addOverlay: document.getElementById('add-overlay'),
    addClose: document.getElementById('add-close'),
    addMonto: document.getElementById('add-monto'),
    addCatSelect: document.getElementById('add-cat-select'),
    addPersonaToggle: document.getElementById('add-persona-toggle'),
    addFecha: document.getElementById('add-fecha'),
    addNota: document.getElementById('add-nota'),
    addSave: document.getElementById('add-save'),
    catOverlay: document.getElementById('cat-overlay'),
    catModalClose: document.getElementById('cat-modal-close'),
    catManageList: document.getElementById('cat-manage-list'),
    newCatIcono: document.getElementById('new-cat-icono'),
    newCatNombre: document.getElementById('new-cat-nombre'),
    newCatAdd: document.getElementById('new-cat-add'),
    confirmOverlay: document.getElementById('confirm-overlay'),
    confirmClose: document.getElementById('confirm-close'),
    confirmTitle: document.getElementById('confirm-title'),
    confirmText: document.getElementById('confirm-text'),
    confirmCancel: document.getElementById('confirm-cancel'),
    confirmOk: document.getElementById('confirm-ok')
  };

  function fmt(n) {
    return '$' + Math.round(n).toLocaleString('es-AR');
  }

  // Deja dígitos + un solo separador decimal. Colapsa cualquier punto/coma
  // posterior al primero, así "1.2.3,4" queda como un número no ambiguo y
  // parseFloat nunca devuelve NaN por separadores repetidos.
  function normMonto(v) {
    v = String(v).replace(/[^0-9.,]/g, '').replace(/,/g, '.');
    var i = v.indexOf('.');
    if (i === -1) return v;
    return v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '');
  }

  function todayISO() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  var toastTimer = null;

  function showToast(msg, opts) {
    opts = opts || {};
    if (toastTimer) clearTimeout(toastTimer);
    els.toast.textContent = msg;
    els.toast.classList.toggle('toast-error', !!opts.error);
    els.toast.classList.add('show');
    toastTimer = setTimeout(function () {
      els.toast.classList.remove('show');
    }, opts.error ? 3800 : 1800);
  }

  // Mensajes crudos del backend (Code.gs) -> frase es-AR amable. Si no está en
  // el mapa se muestra el mensaje tal cual llegó.
  var ERROR_TEXTS = {
    'No se pudo conectar con el servidor': 'No se pudo conectar con el servidor. Probá de nuevo en un rato.',
    'Error del servidor': 'El servidor tuvo un problema. Probá de nuevo.',
    'Monto inválido': 'El monto no es válido. Revisalo y probá de nuevo.',
    'Faltan datos del movimiento': 'Faltan datos del gasto.',
    'Faltan datos de la categoría': 'Faltan datos de la categoría.',
    'Falta el nombre de la categoría': 'Poné un nombre para la categoría.',
    'Esa categoría ya existe': 'Ya hay una categoría con ese nombre.',
    'No se encontró la categoría': 'Esa categoría ya no existe. Actualizá la app.',
    'No se encontró el movimiento': 'Ese gasto ya no existe. Actualizá el historial.',
    'No hay movimientos cargados': 'Todavía no hay gastos cargados.',
    'Token inválido': 'La sesión no es válida. Volvé a abrir la app.'
  };

  function errText(err) {
    var raw = err && err.message ? err.message : String(err || 'Error');
    return ERROR_TEXTS[raw] || raw;
  }

  function toastError(err) {
    showToast(errText(err), { error: true });
  }

  function updateGuardarState() {
    var monto = parseFloat(normMonto(els.monto.value));
    els.btnGuardar.disabled = !(monto > 0 && state.categoriaSel && state.personaSel);
  }

  // ---------- Helper de modales (hoja inferior) ----------
  // Foco atrapado, Escape para cerrar, scroll del fondo bloqueado y foco
  // restaurado al disparador. Lo usan Editar, Nuevo, Ajustes y la hoja de
  // confirmación de borrado.
  var sheetFocusStack = [];
  var openStack = [];
  var viewScrollEl = document.querySelector('.view-scroll');

  function registerSheet(overlay, closeFn) {
    overlay._closeSheet = closeFn;
  }

  function anySheetOpen() {
    return openStack.length > 0;
  }

  function topSheet() {
    return openStack.length ? openStack[openStack.length - 1] : null;
  }

  function focusablesIn(container) {
    var sel = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    return Array.prototype.slice.call(container.querySelectorAll(sel)).filter(function (el) {
      return el.getClientRects().length > 0;
    });
  }

  function openSheet(overlay, firstFocusEl) {
    if (openStack.indexOf(overlay) === -1) openStack.push(overlay);
    sheetFocusStack.push(document.activeElement);
    overlay.hidden = false;
    if (viewScrollEl) viewScrollEl.classList.add('scroll-locked');
    var target = firstFocusEl;
    if (!target) {
      var f = focusablesIn(overlay.querySelector('.modal-sheet'));
      target = f.length ? f[0] : null;
    }
    if (target) { try { target.focus(); } catch (e) {} }
  }

  function closeSheet(overlay) {
    overlay.hidden = true;
    var idx = openStack.indexOf(overlay);
    if (idx !== -1) openStack.splice(idx, 1);
    if (!anySheetOpen() && viewScrollEl) viewScrollEl.classList.remove('scroll-locked');
    var prev = sheetFocusStack.pop();
    if (prev && typeof prev.focus === 'function') {
      try { prev.focus(); } catch (e) {}
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' && e.key !== 'Escape' && e.keyCode !== 9 && e.keyCode !== 27) return;
    var overlay = topSheet();
    if (!overlay) return;
    if (e.key === 'Escape' || e.keyCode === 27) {
      e.preventDefault();
      if (typeof overlay._closeSheet === 'function') overlay._closeSheet();
      return;
    }
    var sheet = overlay.querySelector('.modal-sheet');
    var f = focusablesIn(sheet);
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!sheet.contains(document.activeElement)) {
      e.preventDefault();
      first.focus();
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  // Barra de acción del modal visible cuando se enfoca un campo (teclado móvil).
  // Sube a la vista el botón principal del .modal-sheet activo.
  function keepActionVisible(field) {
    var sheet = field.closest && field.closest('.modal-sheet');
    if (!sheet) return;
    var actions = sheet.querySelector('.modal-actions') || sheet.querySelector('.btn-primary');
    if (actions && actions.scrollIntoView) {
      try { actions.scrollIntoView({ block: 'nearest' }); } catch (e) { actions.scrollIntoView(false); }
    }
  }

  ['edit-overlay', 'add-overlay', 'cat-overlay'].forEach(function (id) {
    var ov = document.getElementById(id);
    if (!ov) return;
    ov.addEventListener('focusin', function (e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) {
        setTimeout(function () { keepActionVisible(t); }, 50);
      }
    });
  });

  // ---------- Hoja de confirmación (reemplaza confirm() nativo) ----------
  var confirmCb = null;

  function openConfirm(opts) {
    opts = opts || {};
    els.confirmTitle.textContent = opts.title || '¿Confirmás?';
    els.confirmText.textContent = opts.text || '';
    els.confirmOk.textContent = opts.okText || 'Borrar';
    confirmCb = typeof opts.onConfirm === 'function' ? opts.onConfirm : null;
    openSheet(els.confirmOverlay, els.confirmCancel);
  }

  function closeConfirm() {
    closeSheet(els.confirmOverlay);
    confirmCb = null;
  }

  registerSheet(els.confirmOverlay, closeConfirm);
  els.confirmClose.addEventListener('click', closeConfirm);
  els.confirmCancel.addEventListener('click', closeConfirm);
  els.confirmOverlay.addEventListener('click', function (e) {
    if (e.target === els.confirmOverlay) closeConfirm();
  });
  els.confirmOk.addEventListener('click', function () {
    var cb = confirmCb;
    closeConfirm();
    if (cb) cb();
  });

  // ---------- Tema ----------
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="4"></circle>' +
    '<line x1="12" y1="2" x2="12" y2="4"></line>' +
    '<line x1="12" y1="20" x2="12" y2="22"></line>' +
    '<line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>' +
    '<line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>' +
    '<line x1="2" y1="12" x2="4" y2="12"></line>' +
    '<line x1="20" y1="12" x2="22" y2="12"></line>' +
    '<line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>' +
    '<line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>' +
    '</svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">' +
    '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>' +
    '</svg>';

  function applyTheme(theme) {
    var isDark = theme === 'dark';
    document.documentElement.classList.toggle('dark', isDark);
    els.btnTheme.innerHTML = isDark ? ICON_SUN : ICON_MOON;
    els.btnTheme.setAttribute('aria-checked', isDark ? 'true' : 'false');
    if (els.themeState) els.themeState.textContent = isDark ? 'Oscuro' : 'Claro';
  }

  function initTheme() {
    var saved = localStorage.getItem('theme');
    if (!saved) {
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    applyTheme(saved);
  }

  els.btnTheme.addEventListener('click', function () {
    var next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  // ---------- Historial ----------
  function diaLabel(iso) {
    var hoy = todayISO();
    var ayerDate = new Date();
    ayerDate.setDate(ayerDate.getDate() - 1);
    var ayer = new Date(ayerDate - ayerDate.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (iso === hoy) return 'Hoy';
    if (iso === ayer) return 'Ayer';
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
  }

  function iconFor(nombre) {
    var c = state.categorias.find(function (c) { return c.nombre === nombre; });
    return c ? c.icono : '💸';
  }

  function renderHistorial(movs) {
    els.historialList.innerHTML = '';
    if (!movs.length) {
      els.historialList.innerHTML = '<div class="empty">Todavía no cargaron ningún gasto.</div>';
      return;
    }

    var grupos = {};
    var orden = [];
    movs.forEach(function (m) {
      if (!grupos[m.fecha]) { grupos[m.fecha] = []; orden.push(m.fecha); }
      grupos[m.fecha].push(m);
    });

    orden.forEach(function (fecha) {
      var group = document.createElement('div');
      group.className = 'day-group';
      var label = document.createElement('div');
      label.className = 'day-label';
      label.textContent = diaLabel(fecha);
      group.appendChild(label);

      grupos[fecha].forEach(function (m) {
        var item = document.createElement('div');
        item.className = 'mov-item';
        if (m.id != null) item.setAttribute('data-id', m.id);
        item.innerHTML =
          '<div class="icon">' + iconFor(m.categoria) + '</div>' +
          '<div class="info">' +
            '<div class="cat">' + m.categoria + '</div>' +
            '<div class="meta">' + m.pagadoPor + (m.nota ? ' · ' + m.nota : '') + '</div>' +
          '</div>' +
          '<div class="amount">' + fmt(m.monto) + '</div>';
        item.addEventListener('click', function () { openEditModal(m); });
        group.appendChild(item);
      });

      els.historialList.appendChild(group);
    });

    // Tras guardar: subir al tope y resaltar el gasto recién agregado.
    if (state.flashNewest && !views.historial.hidden) {
      state.flashNewest = false;
      if (viewScrollEl) viewScrollEl.scrollTop = 0;
      var nuevo = null;
      if (state.flashId != null) {
        nuevo = els.historialList.querySelector('.mov-item[data-id="' + String(state.flashId).replace(/"/g, '\\"') + '"]');
      }
      if (!nuevo) nuevo = els.historialList.querySelector('.mov-item');
      state.flashId = null;
      if (nuevo) {
        nuevo.classList.add('just-added');
        setTimeout(function () { nuevo.classList.remove('just-added'); }, 1100);
      }
    }
  }

    return one + one + one + one;

  // ---------- Resumen: curva de gastos por día ----------
  var SERIES_COLORS = [
    'var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)',
    'var(--series-5)', 'var(--series-6)', 'var(--series-7)'
  ];
  var OTROS_COLOR = 'var(--muted)';

  function smoothPath(pts) {
    if (!pts.length) return '';
    var d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i], p1 = pts[i + 1];
      var midX = (p0.x + p1.x) / 2;
      d += ' C ' + midX.toFixed(1) + ',' + p0.y.toFixed(1) + ' ' + midX.toFixed(1) + ',' + p1.y.toFixed(1) + ' ' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1);
    }
    return d;
  }

  var trendState = null;
  var trendDotEl = null;

  function isoForDia(dia) {
    var now = new Date();
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    var dd = String(dia).padStart(2, '0');
    return now.getFullYear() + '-' + mm + '-' + dd;
  }

  function buildTrend(porDia, diaActual) {
    var svg = els.trendSvg;
    var ns = 'http://www.w3.org/2000/svg';
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // El viewBox se arma con el ancho real en píxeles del contenedor para que
    // 1 unidad = 1px y el trazo no se estire de forma no uniforme (grosor
    // "elástico") ni se salga del recuadro.
    var W = Math.round(svg.parentElement.getBoundingClientRect().width) || 300;
    var H = 100, padTop = 12, padBottom = 12;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    var days = [];
    for (var d = 1; d <= diaActual; d++) days.push(porDia[d] || 0);

    var n = days.length;
    var max = Math.max.apply(null, days.concat([1]));
    var baseline = H - padBottom;

    var points = days.map(function (val, i) {
      var x = n > 1 ? (i / (n - 1)) * W : W / 2;
      var y = baseline - (val / max) * (H - padTop - padBottom);
      return { x: x, y: y };
    });

    trendState = { points: points, days: days, W: W, H: H };

    var defs = document.createElementNS(ns, 'defs');
    var grad = document.createElementNS(ns, 'linearGradient');
    grad.setAttribute('id', 'trendGradient');
    grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
    grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
    var stop1 = document.createElementNS(ns, 'stop');
    stop1.setAttribute('offset', '0%');
    stop1.setAttribute('style', 'stop-color:var(--series-1);stop-opacity:0.35');
    var stop2 = document.createElementNS(ns, 'stop');
    stop2.setAttribute('offset', '100%');
    stop2.setAttribute('style', 'stop-color:var(--series-1);stop-opacity:0');
    grad.appendChild(stop1);
    grad.appendChild(stop2);
    defs.appendChild(grad);
    svg.appendChild(defs);

    var baseLine = document.createElementNS(ns, 'line');
    baseLine.setAttribute('x1', 0);
    baseLine.setAttribute('x2', W);
    baseLine.setAttribute('y1', baseline);
    baseLine.setAttribute('y2', baseline);
    baseLine.setAttribute('stroke', 'var(--border)');
    baseLine.setAttribute('stroke-width', 1);
    baseLine.setAttribute('stroke-dasharray', '3 4');
    svg.appendChild(baseLine);

    if (points.length > 1) {
      var linePath = smoothPath(points);
      var last = points[points.length - 1];
      var first = points[0];
      var areaPath = linePath + ' L' + last.x.toFixed(1) + ',' + baseline + ' L' + first.x.toFixed(1) + ',' + baseline + ' Z';

      var area = document.createElementNS(ns, 'path');
      area.setAttribute('d', areaPath);
      area.setAttribute('fill', 'url(#trendGradient)');
      svg.appendChild(area);

      var line = document.createElementNS(ns, 'path');
      line.setAttribute('d', linePath);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'var(--series-1)');
      line.setAttribute('stroke-width', 2.5);
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(line);
    }

    var lastPoint = points[points.length - 1];
    if (lastPoint) {
      var dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('cx', lastPoint.x);
      dot.setAttribute('cy', lastPoint.y);
      dot.setAttribute('r', 4);
      dot.setAttribute('fill', 'var(--series-1)');
      dot.setAttribute('stroke', 'var(--card)');
      dot.setAttribute('stroke-width', 2);
      svg.appendChild(dot);
      trendDotEl = dot;
    } else {
      trendDotEl = null;
    }

    // Con un solo día no hay curva: mostramos el monto como texto sobre el punto.
    if (n === 1 && lastPoint) {
      var txt = document.createElementNS(ns, 'text');
      txt.setAttribute('x', lastPoint.x);
      txt.setAttribute('y', Math.max(lastPoint.y - 10, 12));
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('fill', 'var(--text)');
      txt.setAttribute('font-size', '13');
      txt.setAttribute('font-weight', '700');
      txt.textContent = fmt(days[0]);
      svg.appendChild(txt);
    }

    if (els.trendCaption) {
      els.trendCaption.textContent = n <= 1
        ? 'Gasto de hoy'
        : 'Gasto por día · deslizá para ver el detalle';
    }
  }

  // ---------- Resumen: mover el punto de la curva para ver cada día ----------
  function moveTrendDot(x, y) {
    if (!trendDotEl) return;
    trendDotEl.setAttribute('cx', x);
    trendDotEl.setAttribute('cy', y);
  }

  function showTrendTooltip(x, y, dia, val) {
    var rect = els.trendSvg.getBoundingClientRect();
    var scaleX = rect.width / trendState.W;
    var scaleY = rect.height / trendState.H;
    els.trendTooltip.textContent = diaLabel(isoForDia(dia)) + ': ' + fmt(val);
    els.trendTooltip.style.top = (y * scaleY) + 'px';
    els.trendTooltip.hidden = false;
    // Clamp horizontal para que no se corte contra el borde de la card.
    var wrapW = els.trendWrap.getBoundingClientRect().width || rect.width;
    var half = els.trendTooltip.offsetWidth / 2;
    var px = Math.max(half + 2, Math.min(x * scaleX, wrapW - half - 2));
    els.trendTooltip.style.left = px + 'px';
  }

  function updateTrendScrub(clientX) {
    if (!trendState || !trendState.points.length) return;
    var rect = els.trendSvg.getBoundingClientRect();
    if (!rect.width) return;
    var scaleX = trendState.W / rect.width;
    var x = (clientX - rect.left) * scaleX;

    var idx = 0, best = Infinity;
    trendState.points.forEach(function (p, i) {
      var d = Math.abs(p.x - x);
      if (d < best) { best = d; idx = i; }
    });

    var p = trendState.points[idx];
    moveTrendDot(p.x, p.y);
    showTrendTooltip(p.x, p.y, idx + 1, trendState.days[idx]);
  }

  function resetTrendScrub() {
    if (!trendState || !trendState.points.length) return;
    var idx = trendState.points.length - 1;
    var last = trendState.points[idx];
    moveTrendDot(last.x, last.y);
    // El tooltip del día de hoy queda visible por defecto (no se oculta).
    showTrendTooltip(last.x, last.y, idx + 1, trendState.days[idx]);
  }

  var trendScrubbing = false;

  els.trendWrap.addEventListener('pointerdown', function (e) {
    trendScrubbing = true;
    if (els.trendWrap.setPointerCapture) els.trendWrap.setPointerCapture(e.pointerId);
    updateTrendScrub(e.clientX);
  });
  els.trendWrap.addEventListener('pointermove', function (e) {
    if (!trendScrubbing) return;
    updateTrendScrub(e.clientX);
  });
  function endTrendScrub() {
    if (!trendScrubbing) return;
    trendScrubbing = false;
    resetTrendScrub();
  }
  els.trendWrap.addEventListener('pointerup', endTrendScrub);
  els.trendWrap.addEventListener('pointercancel', endTrendScrub);
  els.trendWrap.addEventListener('pointerleave', endTrendScrub);

  // ---------- Resumen ----------
  function renderResumen(data) {
    els.resumenTotalVal.textContent = fmt(data.total || 0);
    var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var mesIdx = parseInt((data.mes || todayISO().slice(0, 7)).split('-')[1], 10) - 1;
    els.resumenMesLabel.textContent = 'Total de ' + (meses[mesIdx] || '');

    var partes = [];
    var diaActual = data.diaActual || 0;
    // Solo comparamos con el mes pasado cuando el mes actual ya está bastante
    // avanzado: antes del día 28 sería comparar un período parcial contra un
    // mes completo y siempre daría una "caída" engañosa.
    if (data.totalMesAnterior && diaActual >= 28) {
      var delta = data.total - data.totalMesAnterior;
      var pct = Math.round((delta / data.totalMesAnterior) * 100);
      var signo = delta >= 0 ? '+' : '';
      partes.push((delta >= 0 ? '🔺' : '🔻') + ' ' + signo + pct + '% vs. mes pasado');
    }
    if (data.topCategoria) {
      partes.push('Top: ' + iconFor(data.topCategoria) + ' ' + data.topCategoria);
    }
    if (!partes.length && diaActual > 0) {
      partes.push('Vas ' + fmt(data.total || 0) + ' en ' + diaActual + (diaActual === 1 ? ' día' : ' días'));
    }
    els.resumenInsight.textContent = partes.join(' · ');

    var activos = state.categorias
      .map(function (c) { return { nombre: c.nombre, icono: c.icono, value: (data.porCategoria || {})[c.nombre] || 0 }; })
      .filter(function (e) { return e.value > 0; })
      .sort(function (a, b) { return b.value - a.value; });

    var top = activos.slice(0, 7);
    var resto = activos.slice(7);
    var restoTotal = resto.reduce(function (s, e) { return s + e.value; }, 0);

    var entries = top.map(function (e, i) {
      return { nombre: e.nombre, icono: e.icono, value: e.value, color: SERIES_COLORS[i] };
    });
    if (restoTotal > 0) {
      entries.push({ nombre: 'Otros (' + resto.length + ')', icono: '•', value: restoTotal, color: OTROS_COLOR });
    }

    buildTrend(data.porDia || {}, data.diaActual || 1);
    resetTrendScrub();

    els.resumenCategorias.innerHTML = '';
    if (!entries.length) {
      els.resumenCategorias.innerHTML = '<div class="empty">Todavía no hay gastos este mes.</div>';
    } else {
      var bar = document.createElement('div');
      bar.className = 'split-bar';
      entries.forEach(function (e) {
        var seg = document.createElement('div');
        seg.style.flex = e.value + ' 1 0%';
        seg.style.background = e.color;
        bar.appendChild(seg);
      });
      els.resumenCategorias.appendChild(bar);

      entries.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'legend-row';
        row.innerHTML =
          '<div class="legend-name"><span class="legend-dot" style="background:' + e.color + '"></span>' + e.icono + ' ' + e.nombre + '</div>' +
          '<div class="legend-amt">' + fmt(e.value) + '</div>';
        els.resumenCategorias.appendChild(row);
      });
    }

    els.resumenPersonas.innerHTML = '';
    state.personas.forEach(function (p) {
      var val = (data.porPersona || {})[p] || 0;
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="p-name">' + p + '</div><div class="p-amt">' + fmt(val) + '</div>';
      els.resumenPersonas.appendChild(card);
    });
  }

  var resumenLoadedOnce = false;

  function loadResumen() {
    if (!resumenLoadedOnce) {
      els.resumenTotalVal.textContent = 'Calculando el mes…';
      els.resumenTotalVal.classList.add('resumen-loading');
    }
    return Api.call('getResumenMes').then(function (data) {
      resumenLoadedOnce = true;
      els.resumenTotalVal.classList.remove('resumen-loading');
      renderResumen(data);
    }).catch(function (err) {
      els.resumenTotalVal.classList.remove('resumen-loading');
      if (!resumenLoadedOnce) els.resumenTotalVal.textContent = '—';
      toastError(err);
    });
  }

  // ---------- Categorías (gestión) ----------
  function renderCatManageList() {
    els.catManageList.innerHTML = '';
    state.categorias.forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'cat-manage-row';
      row.innerHTML =
        '<input type="text" class="cat-icono-input" maxlength="4" value="' + c.icono + '">' +
        '<input type="text" class="cat-nombre-input" value="' + c.nombre + '">' +
        '<button class="icon-btn cat-save" type="button" title="Guardar">✓</button>' +
        '<button class="icon-btn cat-del" type="button" title="Borrar">✕</button>';

      var iconoInput = row.querySelector('.cat-icono-input');
      var nombreInput = row.querySelector('.cat-nombre-input');
      var saveBtn = row.querySelector('.cat-save');
      var delBtn = row.querySelector('.cat-del');
      saveBtn.setAttribute('aria-label', 'Guardar cambios de «' + c.nombre + '»');
      delBtn.setAttribute('aria-label', 'Borrar categoría «' + c.nombre + '»');

      saveBtn.addEventListener('click', function () {
        var nuevoNombre = nombreInput.value.trim();
        var nuevoIcono = iconoInput.value.trim() || '💸';
        if (!nuevoNombre) return;
        Api.call('updateCategoria', c.nombre, nuevoNombre, nuevoIcono).then(function () {
          showToast('Categoría actualizada ✓');
          return reloadCategorias();
        }).catch(function (err) {
          toastError(err);
        });
      });

      delBtn.addEventListener('click', function () {
        openConfirm({
          title: 'Borrar categoría',
          text: '¿Borrar la categoría «' + c.nombre + '»? Los gastos ya cargados no se van a borrar.',
          okText: 'Borrar',
          onConfirm: function () {
            Api.call('deleteCategoria', c.nombre).then(function () {
              showToast('Categoría borrada');
              return reloadCategorias();
            }).catch(function (err) {
              toastError(err);
            });
          }
        });
      });

      els.catManageList.appendChild(row);
    });
  }

  function reloadCategorias() {
    return Api.call('getCategorias').then(function (cats) {
      state.categorias = cats;
      renderCategoriaSelect(els.catSelect, state.categoriaSel);
      renderCatManageList();
    });
  }

  els.newCatAdd.addEventListener('click', function () {
    var nombre = els.newCatNombre.value.trim();
    var icono = els.newCatIcono.value.trim() || '💸';
    if (!nombre) { showToast('Ponele un nombre a la categoría'); return; }
    Api.call('addCategoria', nombre, icono).then(function () {
      els.newCatNombre.value = '';
      els.newCatIcono.value = '';
      showToast('Categoría agregada ✓');
      return reloadCategorias();
    }).catch(function (err) {
      toastError(err);
    });
  });

  function closeCatModal() {
    closeSheet(els.catOverlay);
  }

  registerSheet(els.catOverlay, closeCatModal);
  els.btnSettings.addEventListener('click', function () {
    renderCatManageList();
    openSheet(els.catOverlay, els.btnTheme);
  });
  els.catModalClose.addEventListener('click', closeCatModal);
  els.catOverlay.addEventListener('click', function (e) {
    if (e.target === els.catOverlay) closeCatModal();
  });

  // ---------- Navegación ----------
  var views = {
    cargar: document.getElementById('view-cargar'),
    historial: document.getElementById('view-historial'),
    resumen: document.getElementById('view-resumen')
  };
  var currentView = 'cargar';

  var SUBTITLES = {
    cargar: 'Registren un gasto en segundos',
    historial: 'Últimos movimientos',
    resumen: 'Cómo venís este mes'
  };

  function updateSubtitle(view) {
    if (document.getElementById('init-error') && !document.getElementById('init-error').hidden) return;
    els.subtitle.textContent = SUBTITLES[view || currentView] || SUBTITLES.cargar;
  }

  document.querySelectorAll('nav.bottom-nav button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = btn.dataset.view;
      currentView = target;
      Object.keys(views).forEach(function (key) {
        views[key].hidden = key !== target;
      });
      document.querySelectorAll('nav.bottom-nav button').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      els.fabAdd.hidden = target !== 'historial';
      updateSubtitle(target);
      if (target === 'historial') loadHistorial();
      if (target === 'resumen') loadResumen();
    });
  });

  // ---------- Init ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  function showInitError(err) {
    els.subtitle.textContent = 'No se pudieron cargar los datos';
    var box = document.getElementById('init-error');
    if (!box) {
      box = document.createElement('div');
      box.id = 'init-error';
      box.className = 'init-error';
      var msg = document.createElement('span');
      msg.className = 'init-error-msg';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-primary btn-small';
      btn.textContent = 'Reintentar';
      btn.addEventListener('click', function () { initData(); });
      box.appendChild(msg);
      box.appendChild(btn);
      views.cargar.insertBefore(box, views.cargar.firstChild);
    }
    box.querySelector('.init-error-msg').textContent = errText(err);
    box.hidden = false;
  }

  function initData() {
    var box = document.getElementById('init-error');
    if (box) box.hidden = true;
    els.subtitle.textContent = 'Cargando…';
    return Promise.all([Api.call('getCategorias'), Api.call('getPersonas')]).then(function (res) {
      state.categorias = res[0];
      state.personas = res[1];
      renderCategoriaSelect(els.catSelect, null);
      renderPersonas();
      updateSubtitle(currentView);
    }).catch(showInitError);
  }

  initTheme();
  els.fecha.value = todayISO();
  initData();
})();
</script>

</body>
</html>
