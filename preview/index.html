<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <style>
  :root {
    --bg: #efefef;
    --page-bg: var(--bg);
    --card: #ffffff;
    --accent: #141414;
    --accent-contrast: #ffffff;
    --accent-soft: #f1f1f1;
    --text: #141414;
    --muted: #8a8a8e;
    --border: #e4e4e6;
    --danger: #d9483f;
    --nav-bg: rgba(255, 255, 255, 0.9);
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 16px 32px rgba(20, 20, 20, 0.07);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --app-max-width: 480px;

    /* Paleta categórica (validada — ver skill de data-viz) para el anillo de Resumen */
    --series-1: #2a78d6;
    --series-2: #1baf7a;
    --series-3: #eda100;
    --series-4: #008300;
    --series-5: #4a3aa7;
    --series-6: #e34948;
    --series-7: #e87ba4;
  }

  html.dark {
    --bg: #19191b;
    --card: #242426;
    --accent: #f5f5f5;
    --accent-contrast: #141414;
    --accent-soft: rgba(255, 255, 255, 0.06);
    --text: #f5f5f5;
    --muted: #98989c;
    --border: #333336;
    --danger: #ff6b60;
    --nav-bg: rgba(36, 36, 38, 0.9);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 32px rgba(0, 0, 0, 0.5);

    --series-1: #3987e5;
    --series-2: #199e70;
    --series-3: #c98500;
    --series-4: #008300;
    --series-5: #9085e9;
    --series-6: #e66767;
    --series-7: #d55181;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }

  #app {
    max-width: var(--app-max-width);
    width: 100%;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .view-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .view-scroll::-webkit-scrollbar {
    width: 4px;
  }

  .view-scroll::-webkit-scrollbar-track {
    background: transparent;
  }

  .view-scroll::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
  }

  .view-scroll::-webkit-scrollbar-thumb:hover {
    background: var(--muted);
  }

  header.top {
    flex-shrink: 0;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 8px;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .top-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  header.top h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  header.top p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .view { padding: 12px 16px 24px; }
  .view[hidden] { display: none; }

  .card {
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 14px;
  }

  .amount-label {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .amount-input {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    padding: 10px 0 8px;
  }

  .amount-input span {
    font-size: 24px;
    font-weight: 500;
    color: var(--muted);
  }

  .amount-input input {
    border: none;
    background: transparent;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    width: 220px;
    text-align: center;
    color: var(--text);
    outline: none;
  }

  input::placeholder { color: var(--muted); opacity: 1; }
  input:focus::placeholder { color: transparent; }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 4px 4px 10px;
  }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 1px 2px rgba(20, 20, 20, 0.04);
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
  }

  .segmented {
    display: flex;
    gap: 8px;
  }

  .segmented button {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
  }

  .segmented button.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .field input[type="date"],
  .field input[type="text"] {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text);
    background: var(--card);
    outline: none;
    font-family: inherit;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  select {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 40px 12px 14px;
    font-size: 15px;
    color: var(--text);
    background-color: var(--card);
    outline: none;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 22px) center, calc(100% - 17px) center;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }

  select:focus { border-color: var(--accent); }

  .btn-primary {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-primary:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .btn-small {
    width: auto;
    padding: 10px 16px;
    font-size: 14px;
  }

  .btn-danger {
    flex: 1;
    padding: 14px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(96px + var(--safe-bottom));
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 20;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; }

  .day-group { margin-bottom: 18px; }

  .day-group .day-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 4px 8px;
  }

  .mov-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 20px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    margin-bottom: 8px;
    cursor: pointer;
  }

  .mov-item .icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .mov-item .info {
    flex: 1;
    min-width: 0;
  }

  .mov-item .info .cat {
    font-size: 14px;
    font-weight: 600;
  }

  .mov-item .info .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mov-item .amount {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 20px;
  }

  .resumen-total {
    text-align: center;
    padding: 8px 0 4px;
  }

  .trend-wrap {
    position: relative;
    width: 100%;
    height: 100px;
    margin-bottom: 12px;
    touch-action: none;
    cursor: pointer;
  }

  .trend-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .trend-tooltip {
    position: absolute;
    top: 0;
    left: 0;
    transform: translate(-50%, -100%) translateY(-8px);
    background: var(--text);
    color: var(--bg);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 8px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
  }

  .trend-tooltip[hidden] { display: none; }

  .resumen-total .value {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .resumen-total .label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .insight {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }

  .split-bar {
    display: flex;
    gap: 3px;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--border);
    margin-bottom: 14px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .legend-row:last-child { border-bottom: none; }

  .legend-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-amt {
    color: var(--muted);
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .persona-split {
    display: flex;
    gap: 10px;
  }

  .persona-split .card {
    flex: 1;
    text-align: center;
    margin-bottom: 0;
  }

  .persona-split .card .p-name {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  .persona-split .card .p-amt {
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
  }

  nav.bottom-nav {
    flex-shrink: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 8px calc(8px + var(--safe-bottom));
    z-index: 10;
  }

  nav.bottom-nav button {
    flex: 1;
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  nav.bottom-nav button .nav-icon {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  nav.bottom-nav button .nav-icon svg {
    width: 21px;
    height: 21px;
  }

  nav.bottom-nav button.active { color: var(--accent); }

  .fab {
    position: absolute;
    right: 16px;
    bottom: calc(76px + var(--safe-bottom));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(20, 20, 20, 0.22), 0 2px 4px rgba(20, 20, 20, 0.12);
    z-index: 15;
  }

  .fab[hidden] { display: none; }

  .fab svg { width: 24px; height: 24px; }

  /* ---------- Modales ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }

  .modal-overlay[hidden] { display: none; }

  .modal-sheet {
    background: var(--bg);
    width: 100%;
    max-width: var(--app-max-width);
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 28px 28px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom));
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 18px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .modal-actions .btn-primary { flex: 2; }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 16px;
    font-size: 15px;
    font-weight: 600;
  }

  .cat-manage-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .cat-manage-row input {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 14px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
  }

  .cat-manage-row .cat-icono-input {
    width: 44px;
    flex-shrink: 0;
    text-align: center;
  }

  .cat-manage-row .cat-nombre-input { flex: 1; min-width: 0; }

  .new-cat-row {
    display: flex;
    gap: 8px;
  }

  .new-cat-row input {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
  }

  .new-cat-row #new-cat-icono { width: 52px; flex-shrink: 0; text-align: center; }
  .new-cat-row #new-cat-nombre { flex: 1; min-width: 0; }

  /* ---------- Responsive: tablet / desktop ---------- */
  @media (min-width: 700px) {
    :root { --app-max-width: 560px; --page-bg: #dcdcde; }
    html.dark { --page-bg: #0d0d0e; }

    body {
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    #app {
      height: calc(100vh - 64px);
      height: calc(100dvh - 64px);
      max-height: 800px;
      border-radius: 32px;
      box-shadow: var(--shadow);
    }

    .modal-overlay { align-items: center; }
    .modal-sheet { border-radius: 28px; max-height: 80vh; }
  }

  @media (min-width: 1024px) {
    :root { --app-max-width: 640px; }
  }
</style>

</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row">
        <div>
          <h1>Gastos Fran &amp; Marti</h1>
          <p id="subtitle">Cargando…</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-settings" type="button" title="Ajustes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <circle cx="14" cy="6" r="2"></circle>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <circle cx="8" cy="12" r="2"></circle>
              <line x1="4" y1="18" x2="20" y2="18"></line>
              <circle cx="16" cy="18" r="2"></circle>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="view-scroll">
    <!-- ===== Vista: Cargar gasto ===== -->
    <section class="view" id="view-cargar">
      <div class="card">
        <div class="amount-label">Monto</div>
        <div class="amount-input">
          <span>$</span>
          <input type="text" inputmode="decimal" id="input-monto" placeholder="0" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="cat-select">Categoría</label>
        <select id="cat-select">
          <option value="" disabled selected>Elegí una categoría</option>
        </select>
      </div>

      <div class="section-label" style="margin-top:16px">¿Quién pagó?</div>
      <div class="segmented" id="persona-toggle"></div>

      <div class="field" style="margin-top:16px">
        <label for="input-fecha">Fecha</label>
        <input type="date" id="input-fecha">
      </div>

      <div class="field">
        <label for="input-nota">Nota (opcional)</label>
        <input type="text" id="input-nota" placeholder="Ej: cena con amigos" autocomplete="off">
      </div>

      <button class="btn-primary" id="btn-guardar" disabled>Guardar gasto</button>
    </section>

    <!-- ===== Vista: Historial ===== -->
    <section class="view" id="view-historial" hidden>
      <div id="historial-list"></div>
    </section>

    <!-- ===== Vista: Resumen ===== -->
    <section class="view" id="view-resumen" hidden>
      <div class="card resumen-total">
        <div class="trend-wrap" id="trend-wrap">
          <svg viewBox="0 0 300 100" id="trend-svg"></svg>
          <div class="trend-tooltip" id="trend-tooltip" hidden></div>
        </div>
        <div class="value" id="resumen-total-val">$0</div>
        <div class="label" id="resumen-mes-label">Total del mes</div>
        <div class="insight" id="resumen-insight"></div>
      </div>

      <div class="section-label">Por categoría</div>
      <div class="card" id="resumen-categorias"></div>

      <div class="section-label">Pagado por cada uno</div>
      <div class="persona-split" id="resumen-personas"></div>
    </section>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
      <button data-view="cargar" class="active">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
        <span>Cargar</span>
      </button>
      <button data-view="historial">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="20" y2="6"></line>
            <line x1="8" y1="12" x2="20" y2="12"></line>
            <line x1="8" y1="18" x2="20" y2="18"></line>
            <line x1="4" y1="6" x2="4.01" y2="6"></line>
            <line x1="4" y1="12" x2="4.01" y2="12"></line>
            <line x1="4" y1="18" x2="4.01" y2="18"></line>
          </svg>
        </span>
        <span>Historial</span>
      </button>
      <button data-view="resumen">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="20" x2="6" y2="14"></line>
            <line x1="12" y1="20" x2="12" y2="8"></line>
            <line x1="18" y1="20" x2="18" y2="4"></line>
          </svg>
        </span>
        <span>Resumen</span>
      </button>
    </nav>

    <button class="fab" id="fab-add" type="button" title="Agregar gasto" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <!-- ===== Modal: editar gasto ===== -->
    <div class="modal-overlay" id="edit-overlay" hidden>
      <div class="modal-sheet">
        <div class="modal-header">
          <h2>Editar gasto</h2>

  <script src="mock-api.js"></script>
<script>
(function () {
  'use strict';

  // ---- Api ----
  // - Preview local en el navegador: usa window.MockApi (mock-api.js).
  // - App publicada: JSONP contra la web app de Apps Script. No se puede usar
  //   fetch() porque Apps Script no manda headers de CORS; un <script src> los
  //   esquiva. Por eso todo va por GET con ?fn=&args=&callback=.
  // El build web reemplaza '__API_URL__' por la URL /exec real.
  var API_URL = '__API_URL__';
  var jsonpSeq = 0;

  var Api = {
    call: function (fn) {
      var args = Array.prototype.slice.call(arguments, 1);

      if (window.MockApi && typeof window.MockApi[fn] === 'function') {
        return Promise.resolve().then(function () {
          return window.MockApi[fn].apply(null, args);
        });
      }

      return new Promise(function (resolve, reject) {
        var cb = '__jsonp' + Date.now() + '_' + (++jsonpSeq);
        var script = document.createElement('script');
        var timer = setTimeout(function () {
          finish();
          reject(new Error('No se pudo conectar con el servidor'));
        }, 20000);

        function finish() {
          clearTimeout(timer);
          try { delete window[cb]; } catch (e) { window[cb] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cb] = function (res) {
          finish();
          if (!res || res.ok !== true) {
            reject(new Error(res && res.error ? res.error : 'Error del servidor'));
          } else {
            resolve(res.data);
          }
        };

        script.onerror = function () {
          finish();
          reject(new Error('No se pudo conectar con el servidor'));
        };

        script.src = API_URL +
          '?fn=' + encodeURIComponent(fn) +
          '&args=' + encodeURIComponent(JSON.stringify(args)) +
          '&callback=' + cb +
          '&_=' + Date.now();
        document.head.appendChild(script);
      });
    }
  };

  var state = {
    categorias: [],
    personas: [],
    categoriaSel: null,
    personaSel: null,
    editId: null,
    editPersonaSel: null,
    addPersonaSel: null
  };

  var els = {
    subtitle: document.getElementById('subtitle'),
    catSelect: document.getElementById('cat-select'),
    personaToggle: document.getElementById('persona-toggle'),
    monto: document.getElementById('input-monto'),
    fecha: document.getElementById('input-fecha'),
    nota: document.getElementById('input-nota'),
    btnGuardar: document.getElementById('btn-guardar'),
    toast: document.getElementById('toast'),
    historialList: document.getElementById('historial-list'),
    resumenTotalVal: document.getElementById('resumen-total-val'),
    resumenMesLabel: document.getElementById('resumen-mes-label'),
    resumenInsight: document.getElementById('resumen-insight'),
    trendWrap: document.getElementById('trend-wrap'),
    trendSvg: document.getElementById('trend-svg'),
    trendTooltip: document.getElementById('trend-tooltip'),
    resumenCategorias: document.getElementById('resumen-categorias'),
    resumenPersonas: document.getElementById('resumen-personas'),
    btnTheme: document.getElementById('btn-theme'),
    btnSettings: document.getElementById('btn-settings'),
    editOverlay: document.getElementById('edit-overlay'),
    editClose: document.getElementById('edit-close'),
    editMonto: document.getElementById('edit-monto'),
    editCatSelect: document.getElementById('edit-cat-select'),
    editPersonaToggle: document.getElementById('edit-persona-toggle'),
    editFecha: document.getElementById('edit-fecha'),
    editNota: document.getElementById('edit-nota'),
    editSave: document.getElementById('edit-save'),
    editDelete: document.getElementById('edit-delete'),
    fabAdd: document.getElementById('fab-add'),
    addOverlay: document.getElementById('add-overlay'),
    addClose: document.getElementById('add-close'),
    addMonto: document.getElementById('add-monto'),
    addCatSelect: document.getElementById('add-cat-select'),
    addPersonaToggle: document.getElementById('add-persona-toggle'),
    addFecha: document.getElementById('add-fecha'),
    addNota: document.getElementById('add-nota'),
    addSave: document.getElementById('add-save'),
    catOverlay: document.getElementById('cat-overlay'),
    catModalClose: document.getElementById('cat-modal-close'),
    catManageList: document.getElementById('cat-manage-list'),
    newCatIcono: document.getElementById('new-cat-icono'),
    newCatNombre: document.getElementById('new-cat-nombre'),
    newCatAdd: document.getElementById('new-cat-add')
  };

  function fmt(n) {
    return '$' + Math.round(n).toLocaleString('es-AR');
  }

  function todayISO() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    setTimeout(function () { els.toast.classList.remove('show'); }, 1800);
  }

  function updateGuardarState() {
    var monto = parseFloat(els.monto.value);
    els.btnGuardar.disabled = !(monto > 0 && state.categoriaSel && state.personaSel);
  }

  // ---------- Tema ----------
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="4"></circle>' +
    '<line x1="12" y1="2" x2="12" y2="4"></line>' +
    '<line x1="12" y1="20" x2="12" y2="22"></line>' +
    '<line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>' +
    '<line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>' +
    '<line x1="2" y1="12" x2="4" y2="12"></line>' +
    '<line x1="20" y1="12" x2="22" y2="12"></line>' +
    '<line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>' +
    '<line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>' +
    '</svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">' +
    '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>' +
    '</svg>';

  function applyTheme(theme) {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    els.btnTheme.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
  }

  function initTheme() {
    var saved = localStorage.getItem('theme');
    if (!saved) {
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    applyTheme(saved);
  }

  els.btnTheme.addEventListener('click', function () {
    var next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  // ---------- Cargar gasto ----------
  function renderCategoriaSelect(selectEl, selected) {
    selectEl.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Elegí una categoría';
    placeholder.disabled = true;
    if (!selected) placeholder.selected = true;
    selectEl.appendChild(placeholder);

    state.categorias.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.nombre;
      opt.textContent = c.icono + ' ' + c.nombre;
      if (c.nombre === selected) opt.selected = true;
      selectEl.appendChild(opt);
    });
  }

  els.catSelect.addEventListener('change', function () {
    state.categoriaSel = els.catSelect.value || null;
    updateGuardarState();
  });

  function renderPersonas() {
    els.personaToggle.innerHTML = '';
    state.personas.forEach(function (p) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = p;
      btn.addEventListener('click', function () {
        state.personaSel = p;
        Array.prototype.forEach.call(els.personaToggle.children, function (el) {
          el.classList.toggle('active', el.textContent === p);
        });
        updateGuardarState();
      });
      els.personaToggle.appendChild(btn);
    });
  }

  els.monto.addEventListener('input', function () {
    els.monto.value = els.monto.value.replace(/[^0-9.,]/g, '');
    updateGuardarState();
  });

  els.btnGuardar.addEventListener('click', function () {
    var monto = parseFloat(els.monto.value.replace(',', '.'));
    if (!(monto > 0) || !state.categoriaSel || !state.personaSel) return;

    els.btnGuardar.disabled = true;
    els.btnGuardar.textContent = 'Guardando…';

    Api.call('addMovimiento', {
      categoria: state.categoriaSel,
      monto: monto,
      pagadoPor: state.personaSel,
      fecha: els.fecha.value || todayISO(),
      nota: els.nota.value.trim()
    }).then(function () {
      showToast('Gasto guardado ✓');
      els.monto.value = '';
      els.nota.value = '';
      state.categoriaSel = null;
      els.catSelect.value = '';
      state.personaSel = null;
      Array.prototype.forEach.call(els.personaToggle.children, function (el) { el.classList.remove('active'); });
      loadHistorial();
      loadResumen();
    }).catch(function (err) {
      showToast('Error: ' + (err && err.message ? err.message : err));
    }).finally(function () {
      els.btnGuardar.textContent = 'Guardar gasto';
      updateGuardarState();
    });
  });

  // ---------- Historial ----------
  function diaLabel(iso) {
    var hoy = todayISO();
    var ayerDate = new Date();
    ayerDate.setDate(ayerDate.getDate() - 1);
    var ayer = new Date(ayerDate - ayerDate.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (iso === hoy) return 'Hoy';
    if (iso === ayer) return 'Ayer';
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
  }

  function iconFor(nombre) {
    var c = state.categorias.find(function (c) { return c.nombre === nombre; });
    return c ? c.icono : '💸';
  }

  function renderHistorial(movs) {
    els.historialList.innerHTML = '';
    if (!movs.length) {
      els.historialList.innerHTML = '<div class="empty">Todavía no cargaron ningún gasto.</div>';
      return;
    }

    var grupos = {};
    var orden = [];
    movs.forEach(function (m) {
      if (!grupos[m.fecha]) { grupos[m.fecha] = []; orden.push(m.fecha); }
      grupos[m.fecha].push(m);
    });

    orden.forEach(function (fecha) {
      var group = document.createElement('div');
      group.className = 'day-group';
      var label = document.createElement('div');
      label.className = 'day-label';
      label.textContent = diaLabel(fecha);
      group.appendChild(label);

      grupos[fecha].forEach(function (m) {
        var item = document.createElement('div');
        item.className = 'mov-item';
        item.innerHTML =
          '<div class="icon">' + iconFor(m.categoria) + '</div>' +
          '<div class="info">' +
            '<div class="cat">' + m.categoria + '</div>' +
            '<div class="meta">' + m.pagadoPor + (m.nota ? ' · ' + m.nota : '') + '</div>' +
          '</div>' +
          '<div class="amount">' + fmt(m.monto) + '</div>';
        item.addEventListener('click', function () { openEditModal(m); });
        group.appendChild(item);
      });

      els.historialList.appendChild(group);
    });
  }

  function loadHistorial() {
    Api.call('getMovimientos', 200).then(renderHistorial);
  }

  // ---------- Agregar gasto (modal desde Historial) ----------
  function openAddModal() {
    state.addPersonaSel = null;
    els.addMonto.value = '';
    els.addNota.value = '';
    els.addFecha.value = todayISO();
    renderCategoriaSelect(els.addCatSelect, null);

    els.addPersonaToggle.innerHTML = '';
    state.personas.forEach(function (p) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = p;
      btn.addEventListener('click', function () {
        state.addPersonaSel = p;
        Array.prototype.forEach.call(els.addPersonaToggle.children, function (el) {
          el.classList.toggle('active', el.textContent === p);
        });
      });
      els.addPersonaToggle.appendChild(btn);

    els.addOverlay.hidden = false;

  function closeAddModal() {
    els.addOverlay.hidden = true;
  }

  els.fabAdd.addEventListener('click', openAddModal);
  els.addClose.addEventListener('click', closeAddModal);
  els.addOverlay.addEventListener('click', function (e) {
    if (e.target === els.addOverlay) closeAddModal();
  });

  els.addMonto.addEventListener('input', function () {
    els.addMonto.value = els.addMonto.value.replace(/[^0-9.,]/g, '');
  });

  els.addSave.addEventListener('click', function () {
    var monto = parseFloat(els.addMonto.value.replace(',', '.'));
    var categoria = els.addCatSelect.value;
    if (!(monto > 0) || !categoria || !state.addPersonaSel) {
      showToast('Completá monto, categoría y quién pagó');
      return;
    }
    els.addSave.disabled = true;
    els.addSave.textContent = 'Guardando…';
    Api.call('addMovimiento', {
      categoria: categoria,
      monto: monto,
      pagadoPor: state.addPersonaSel,
      fecha: els.addFecha.value || todayISO(),
      nota: els.addNota.value.trim()
    }).then(function () {
      showToast('Gasto guardado ✓');
      closeAddModal();
      loadHistorial();
      loadResumen();
    }).catch(function (err) {
      showToast('Error: ' + (err && err.message ? err.message : err));
    }).finally(function () {
      els.addSave.disabled = false;
      els.addSave.textContent = 'Guardar gasto';
    });
  });

  // ---------- Editar gasto ----------
  function openEditModal(m) {
    state.editId = m.id;
    state.editPersonaSel = m.pagadoPor;
    els.editMonto.value = m.monto;
    renderCategoriaSelect(els.editCatSelect, m.categoria);
    els.editFecha.value = m.fecha;
    els.editNota.value = m.nota || '';

    els.editPersonaToggle.innerHTML = '';
    state.personas.forEach(function (p) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = p;
      btn.classList.toggle('active', p === m.pagadoPor);
      btn.addEventListener('click', function () {
        state.editPersonaSel = p;
        Array.prototype.forEach.call(els.editPersonaToggle.children, function (el) {
          el.classList.toggle('active', el.textContent === p);
        });

      els.editPersonaToggle.appendChild(btn);

  function closeEditModal() {
    els.editOverlay.hidden = true;
    state.editId = null;
  }

  els.editClose.addEventListener('click', closeEditModal);
  els.editOverlay.addEventListener('click', function (e) {
    if (e.target === els.editOverlay) closeEditModal();
  });

  els.editSave.addEventListener('click', function () {
    var monto = parseFloat(els.editMonto.value.replace(',', '.'));
    var categoria = els.editCatSelect.value;
    if (!(monto > 0) || !categoria || !state.editPersonaSel) {
      showToast('Completá monto, categoría y quién pagó');
      return;
    }
    els.editSave.disabled = true;
    Api.call('updateMovimiento', {
      id: state.editId,
      categoria: categoria,
      monto: monto,
      pagadoPor: state.editPersonaSel,
      fecha: els.editFecha.value || todayISO(),
      nota: els.editNota.value.trim()
    }).then(function () {
      showToast('Gasto actualizado ✓');
      closeEditModal();
      loadHistorial();
      loadResumen();

      showToast('Error: ' + (err && err.message ? err.message : err));

      els.editSave.disabled = false;
    });

  els.editDelete.addEventListener('click', function () {
    if (!confirm('¿Borrar este gasto?')) return;
    Api.call('deleteMovimiento', state.editId).then(function () {
      showToast('Gasto borrado');
      closeEditModal();
      loadHistorial();
      loadResumen();
    });

  // ---------- Resumen: curva de gastos por día ----------
  var SERIES_COLORS = [
    'var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)',
    'var(--series-5)', 'var(--series-6)', 'var(--series-7)'
  ];
  var OTROS_COLOR = 'var(--muted)';

  function smoothPath(pts) {
    if (!pts.length) return '';
    var d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i], p1 = pts[i + 1];
      var midX = (p0.x + p1.x) / 2;
      d += ' C ' + midX.toFixed(1) + ',' + p0.y.toFixed(1) + ' ' + midX.toFixed(1) + ',' + p1.y.toFixed(1) + ' ' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1);
    }
    return d;
  }

  var trendState = null;
  var trendDotEl = null;

  function isoForDia(dia) {
    var now = new Date();
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    var dd = String(dia).padStart(2, '0');
    return now.getFullYear() + '-' + mm + '-' + dd;
  }

  function buildTrend(porDia, diaActual) {
    var svg = els.trendSvg;
    var ns = 'http://www.w3.org/2000/svg';
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // El viewBox se arma con el ancho real en píxeles del contenedor para que
    // 1 unidad = 1px y el trazo no se estire de forma no uniforme (grosor
    // "elástico") ni se salga del recuadro.
    var W = Math.round(svg.parentElement.getBoundingClientRect().width) || 300;
    var H = 100, padTop = 12, padBottom = 12;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    var days = [];
    for (var d = 1; d <= diaActual; d++) days.push(porDia[d] || 0);

    var n = days.length;
    var max = Math.max.apply(null, days.concat([1]));
    var baseline = H - padBottom;

    var points = days.map(function (val, i) {
      var x = n > 1 ? (i / (n - 1)) * W : W / 2;
      var y = baseline - (val / max) * (H - padTop - padBottom);
      return { x: x, y: y };
    });

    trendState = { points: points, days: days, W: W, H: H };

    var defs = document.createElementNS(ns, 'defs');
    var grad = document.createElementNS(ns, 'linearGradient');
    grad.setAttribute('id', 'trendGradient');
    grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
    grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
    var stop1 = document.createElementNS(ns, 'stop');
    stop1.setAttribute('offset', '0%');
    stop1.setAttribute('style', 'stop-color:var(--series-1);stop-opacity:0.35');
    var stop2 = document.createElementNS(ns, 'stop');
    stop2.setAttribute('offset', '100%');
    stop2.setAttribute('style', 'stop-color:var(--series-1);stop-opacity:0');
    grad.appendChild(stop1);
    grad.appendChild(stop2);
    defs.appendChild(grad);
    svg.appendChild(defs);

    var baseLine = document.createElementNS(ns, 'line');
    baseLine.setAttribute('x1', 0);
    baseLine.setAttribute('x2', W);
    baseLine.setAttribute('y1', baseline);
    baseLine.setAttribute('y2', baseline);
    baseLine.setAttribute('stroke', 'var(--border)');
    baseLine.setAttribute('stroke-width', 1);
    baseLine.setAttribute('stroke-dasharray', '3 4');
    svg.appendChild(baseLine);

    if (points.length > 1) {
      var linePath = smoothPath(points);
      var last = points[points.length - 1];
      var first = points[0];
      var areaPath = linePath + ' L' + last.x.toFixed(1) + ',' + baseline + ' L' + first.x.toFixed(1) + ',' + baseline + ' Z';

      var area = document.createElementNS(ns, 'path');
      area.setAttribute('d', areaPath);
      area.setAttribute('fill', 'url(#trendGradient)');
      svg.appendChild(area);

      var line = document.createElementNS(ns, 'path');
      line.setAttribute('d', linePath);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'var(--series-1)');
      line.setAttribute('stroke-width', 2.5);
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(line);
    }

    var lastPoint = points[points.length - 1];
    if (lastPoint) {
      var dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('cx', lastPoint.x);
      dot.setAttribute('cy', lastPoint.y);
      dot.setAttribute('r', 4);
      dot.setAttribute('fill', 'var(--series-1)');
      dot.setAttribute('stroke', 'var(--card)');
      dot.setAttribute('stroke-width', 2);
      svg.appendChild(dot);
      trendDotEl = dot;
    } else {
      trendDotEl = null;
    }
  }

  // ---------- Resumen: mover el punto de la curva para ver cada día ----------
  function moveTrendDot(x, y) {
    if (!trendDotEl) return;
    trendDotEl.setAttribute('cx', x);
    trendDotEl.setAttribute('cy', y);
  }

  function showTrendTooltip(x, y, dia, val) {
    var rect = els.trendSvg.getBoundingClientRect();
    var scaleX = rect.width / trendState.W;
    var scaleY = rect.height / trendState.H;
    els.trendTooltip.style.left = (x * scaleX) + 'px';
    els.trendTooltip.style.top = (y * scaleY) + 'px';
    els.trendTooltip.textContent = diaLabel(isoForDia(dia)) + ': ' + fmt(val);
    els.trendTooltip.hidden = false;
  }

  function updateTrendScrub(clientX) {
    if (!trendState || !trendState.points.length) return;
    var rect = els.trendSvg.getBoundingClientRect();
    if (!rect.width) return;
    var scaleX = trendState.W / rect.width;
    var x = (clientX - rect.left) * scaleX;

    var idx = 0, best = Infinity;
    trendState.points.forEach(function (p, i) {
      var d = Math.abs(p.x - x);
      if (d < best) { best = d; idx = i; }
    });

    var p = trendState.points[idx];
    moveTrendDot(p.x, p.y);
    showTrendTooltip(p.x, p.y, idx + 1, trendState.days[idx]);
  }

  function resetTrendScrub() {
    if (!trendState || !trendState.points.length) return;
    var last = trendState.points[trendState.points.length - 1];
    moveTrendDot(last.x, last.y);
    els.trendTooltip.hidden = true;
  }

  var trendScrubbing = false;

  els.trendWrap.addEventListener('pointerdown', function (e) {
    trendScrubbing = true;
    if (els.trendWrap.setPointerCapture) els.trendWrap.setPointerCapture(e.pointerId);
    updateTrendScrub(e.clientX);
  });
  els.trendWrap.addEventListener('pointermove', function (e) {
    if (!trendScrubbing) return;
    updateTrendScrub(e.clientX);
  });
  function endTrendScrub() {
    if (!trendScrubbing) return;
    trendScrubbing = false;
    resetTrendScrub();
  }
  els.trendWrap.addEventListener('pointerup', endTrendScrub);
  els.trendWrap.addEventListener('pointercancel', endTrendScrub);
  els.trendWrap.addEventListener('pointerleave', endTrendScrub);

  // ---------- Resumen ----------
  function renderResumen(data) {
    els.resumenTotalVal.textContent = fmt(data.total || 0);
    var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var mesIdx = parseInt((data.mes || todayISO().slice(0, 7)).split('-')[1], 10) - 1;
    els.resumenMesLabel.textContent = 'Total de ' + (meses[mesIdx] || '');

    var partes = [];
    if (data.totalMesAnterior) {
      var delta = data.total - data.totalMesAnterior;
      var pct = Math.round((delta / data.totalMesAnterior) * 100);
      var signo = delta >= 0 ? '+' : '';
      partes.push((delta >= 0 ? '🔺' : '🔻') + ' ' + signo + pct + '% vs. mes pasado');
    }
    if (data.topCategoria) {
      partes.push('Top: ' + iconFor(data.topCategoria) + ' ' + data.topCategoria);
    }
    els.resumenInsight.textContent = partes.join(' · ');

    var activos = state.categorias
      .map(function (c) { return { nombre: c.nombre, icono: c.icono, value: (data.porCategoria || {})[c.nombre] || 0 }; })
      .filter(function (e) { return e.value > 0; })
      .sort(function (a, b) { return b.value - a.value; });

    var top = activos.slice(0, 7);
    var resto = activos.slice(7);
    var restoTotal = resto.reduce(function (s, e) { return s + e.value; }, 0);

    var entries = top.map(function (e, i) {
      return { nombre: e.nombre, icono: e.icono, value: e.value, color: SERIES_COLORS[i] };
    });
    if (restoTotal > 0) {
      entries.push({ nombre: 'Otros (' + resto.length + ')', icono: '•', value: restoTotal, color: OTROS_COLOR });
    }

    buildTrend(data.porDia || {}, data.diaActual || 1);

    els.resumenCategorias.innerHTML = '';
    if (!entries.length) {
      els.resumenCategorias.innerHTML = '<div class="empty">Todavía no hay gastos este mes.</div>';
    } else {
      var bar = document.createElement('div');
      bar.className = 'split-bar';
      entries.forEach(function (e) {
        var seg = document.createElement('div');
        seg.style.flex = e.value + ' 1 0%';
        seg.style.background = e.color;
        bar.appendChild(seg);
      });
      els.resumenCategorias.appendChild(bar);

      entries.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'legend-row';
        row.innerHTML =
          '<div class="legend-name"><span class="legend-dot" style="background:' + e.color + '"></span>' + e.icono + ' ' + e.nombre + '</div>' +
          '<div class="legend-amt">' + fmt(e.value) + '</div>';
        els.resumenCategorias.appendChild(row);
      });
    }

    els.resumenPersonas.innerHTML = '';
    state.personas.forEach(function (p) {
      var val = (data.porPersona || {})[p] || 0;
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="p-name">' + p + '</div><div class="p-amt">' + fmt(val) + '</div>';
      els.resumenPersonas.appendChild(card);
    });
  }

  function loadResumen() {
    Api.call('getResumenMes').then(renderResumen);
  }

  // ---------- Categorías (gestión) ----------
  function renderCatManageList() {
    els.catManageList.innerHTML = '';
    state.categorias.forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'cat-manage-row';
      row.innerHTML =
        '<input type="text" class="cat-icono-input" maxlength="4" value="' + c.icono + '">' +
        '<input type="text" class="cat-nombre-input" value="' + c.nombre + '">' +
        '<button class="icon-btn cat-save" type="button" title="Guardar">✓</button>' +
        '<button class="icon-btn cat-del" type="button" title="Borrar">✕</button>';

      var iconoInput = row.querySelector('.cat-icono-input');
      var nombreInput = row.querySelector('.cat-nombre-input');

      row.querySelector('.cat-save').addEventListener('click', function () {
        var nuevoNombre = nombreInput.value.trim();
        var nuevoIcono = iconoInput.value.trim() || '💸';
        if (!nuevoNombre) return;
        Api.call('updateCategoria', c.nombre, nuevoNombre, nuevoIcono).then(function () {
          showToast('Categoría actualizada ✓');
          return reloadCategorias();
        }).catch(function (err) {
          showToast('Error: ' + (err && err.message ? err.message : err));
        });
      });

      row.querySelector('.cat-del').addEventListener('click', function () {
        if (!confirm('¿Borrar la categoría "' + c.nombre + '"? Los gastos ya cargados no se van a borrar.')) return;
        Api.call('deleteCategoria', c.nombre).then(function () {
          showToast('Categoría borrada');
          return reloadCategorias();
        }).catch(function (err) {
          showToast('Error: ' + (err && err.message ? err.message : err));
        });
      });

      els.catManageList.appendChild(row);
    });
  }

  function reloadCategorias() {
    return Api.call('getCategorias').then(function (cats) {
      state.categorias = cats;
      renderCategoriaSelect(els.catSelect, state.categoriaSel);
      renderCatManageList();
    });
  }

  els.newCatAdd.addEventListener('click', function () {
    var nombre = els.newCatNombre.value.trim();
    var icono = els.newCatIcono.value.trim() || '💸';
    if (!nombre) { showToast('Ponele un nombre a la categoría'); return; }
    Api.call('addCategoria', nombre, icono).then(function () {
      els.newCatNombre.value = '';
      els.newCatIcono.value = '';
      showToast('Categoría agregada ✓');
      return reloadCategorias();
    }).catch(function (err) {
      showToast('Error: ' + (err && err.message ? err.message : err));
    });
  });

  els.btnSettings.addEventListener('click', function () {
    renderCatManageList();
    els.catOverlay.hidden = false;
  });
  els.catModalClose.addEventListener('click', function () { els.catOverlay.hidden = true; });
  els.catOverlay.addEventListener('click', function (e) {
    if (e.target === els.catOverlay) els.catOverlay.hidden = true;
  });

  // ---------- Navegación ----------
  var views = {
    cargar: document.getElementById('view-cargar'),
    historial: document.getElementById('view-historial'),
    resumen: document.getElementById('view-resumen')
  };

  document.querySelectorAll('nav.bottom-nav button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = btn.dataset.view;
      Object.keys(views).forEach(function (key) {
        views[key].hidden = key !== target;
      });
      document.querySelectorAll('nav.bottom-nav button').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      els.fabAdd.hidden = target !== 'historial';
      if (target === 'historial') loadHistorial();
      if (target === 'resumen') loadResumen();
    });
  });

  // ---------- Init ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  initTheme();
  els.fecha.value = todayISO();

  Promise.all([Api.call('getCategorias'), Api.call('getPersonas')]).then(function (res) {
    state.categorias = res[0];
    state.personas = res[1];
    renderCategoriaSelect(els.catSelect, null);
    renderPersonas();
    els.subtitle.textContent = 'Registren un gasto en segundos';
  }).catch(function (err) {
    els.subtitle.textContent = 'Error cargando datos: ' + (err && err.message ? err.message : err);
  });
})();
</script>

</body>
</html>
